<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strokes Gained Tracker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Strokes Gained Tracker</h1>
        <button id="start-round-btn">Start Round</button>
        <div id="round-form" class="hidden">
            <h2>Enter Round Details</h2>
            <form id="round-details-form">
                <label for="fairway-hit">Hit Fairway?</label>
                <select id="fairway-hit">
                    <option value="yes">Yes</option>
                    <option value="no">No</option>
                </select>

                <label for="drive-distance">Drive Distance (yards):</label>
                <input type="number" id="drive-distance" required>

                <label for="approach-shot">Approach Shot Distance (yards):</label>
                <input type="number" id="approach-shot" required>

                <label for="lie">Lie Type:</label>
                <input type="text" id="lie">

                <label for="hit-green">Hit Green?</label>
                <select id="hit-green">
                    <option value="yes">Yes</option>
                    <option value="no">No</option>
                </select>

                <div id="putts-section" class="hidden">
                    <label for="putts">Number of Putts:</label>
                    <input type="number" id="putts">
                    <label for="proximity">Proximity to Hole (yards):</label>
                    <input type="number" id="proximity">
                </div>

                <div id="missed-green-section" class="hidden">
                    <label for="missed-green-lie">Missed Green Lie Type:</label>
                    <input type="text" id="missed-green-lie">
                    <label for="missed-green-distance">Missed Green Distance (yards):</label>
                    <input type="number" id="missed-green-distance">
                </div>

                <button type="submit">Calculate Strokes Gained</button>
            </form>
        </div>

        <div id="round-results" class="hidden">
            <h2>Round Results</h2>
            <div id="summary"></div>
            <div id="round-stats"></div>
            <button id="save-round-btn">Save Round</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
